
services:
  backend:
    build: ./backend
    container_name: eventusv-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./.env:/app/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventusv-web
    ports:
      - "5173:5173"
    env_file: ./.env


